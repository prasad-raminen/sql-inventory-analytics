# Local development stack: SQL Server 2022 -> DbUp migrator (schema + demo seed) -> API.
#   docker compose up --build
# The SA password below is a throwaway local-development value; never reuse it anywhere real.
x-db-connection: &db-connection "Server=sqlserver,1433;Database=InventoryAnalytics;User Id=sa;Password=Your_strong_password123;TrustServerCertificate=True;Encrypt=True"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_password123"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  migrator:
    build:
      context: .
      target: migrator
    environment:
      ConnectionStrings__InventoryDb: *db-connection
    command: ["--seed"]
    depends_on:
      sqlserver:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__InventoryDb: *db-connection
    ports:
      - "8080:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully

volumes:
  sqldata:
